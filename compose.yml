services:
  workspace:
    build: .
    image: narl-workspace:latest
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM and reaps anything the binary leaves behind.
    init: true
    env_file:
      - .env
    environment:
      # These win over anything in .env: inside the container the app must
      # listen on all interfaces and keep its state on the volume.
      WORKSPACE_BIND: 0.0.0.0:4242
      WORKSPACE_DATA_DIR: /data
    volumes:
      # Named for what it held when it was made. Renaming it would mean moving
      # the database into a new volume by hand, which is no kind of upgrade.
      - diary-data:/data
    networks:
      - internal_net
    ports:
      # Localhost only. Drop this in the override when a reverse proxy
      # reaches the container over its own network instead.
      - "127.0.0.1:4242:4242"
      # Only listens if WORKSPACE_SFTP_BIND is set in .env (see there);
      # otherwise this maps to a port nothing is bound on. Traefik is
      # HTTP-only, so a deployment behind it must publish this port itself
      # rather than relying on the reverse proxy — see compose.override.yml.example.
      # - "127.0.0.1:2222:2222"
    healthcheck:
      # The image has bash and nothing like curl: a request by hand, and a
      # 200 from /api/health, which also asks the database.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4242 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  diary-data:

networks:
  internal_net:
